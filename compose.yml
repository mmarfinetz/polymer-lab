services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: polymer_lab
      POSTGRES_USER: polymer
      POSTGRES_PASSWORD: polymer
    ports:
      - "5432:5432"
    volumes:
      - polymer-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymer -d polymer_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: polymer
      MINIO_ROOT_PASSWORD: polymer-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - polymer-minio:/data

volumes:
  polymer-postgres:
  polymer-minio:

